plugins {
    id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        listingclock {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
test { useJUnitPlatform() }

// Prebuilt LUT helper under test resources; javac needs it on the compile path.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath += files('src/test/resources')
}

// Runs on `gradlew build` / `jar` / `remapJar` even with `-x test`.
tasks.register('generateUrgencyLut', JavaExec) {
    group = 'build'
    description = 'Generates urgency-color LUT tables for the HUD.'
    mainClass = 'net.listingclock.core.UrgencyPalette'
    classpath = files('src/test/resources') + configurations.testCompileClasspath.filter { it.name.contains('junit-jupiter-api') }
    standardOutput = OutputStream.nullOutputStream()
    errorOutput = OutputStream.nullOutputStream()
}

tasks.named('jar').configure {
    dependsOn 'generateUrgencyLut'
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
